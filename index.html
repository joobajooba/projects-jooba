<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Jooba</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      try {
        if (localStorage.getItem('j00ba-font-mode') === 'readable') {
          document.documentElement.classList.add('font-readable');
        }
        const textScale = Number(localStorage.getItem('j00ba-text-scale'));
        if (Number.isFinite(textScale) && textScale >= 1 && textScale <= 1.6) {
          document.documentElement.style.setProperty('--text-scale', String(textScale));
        }
      } catch (error) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
